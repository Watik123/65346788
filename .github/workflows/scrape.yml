# Збір цін на серверах GitHub (у контейнері розробки доступу до сайтів магазинів немає).
#  - щодня збирає ціни всіх магазинів і зберігає їх у datastore/; запуск за розкладом двічі
#    (04:17 і 08:17 за Києвом), бо GitHub часом запізнюється з ним на години; другий запуск
#    нічого не збирає, якщо ціни дня вже є (позначка datastore/prices/<дата>/.complete);
#  - вручну (вкладка Actions → «Збір цін» → Run workflow): збір, розвідка сайту або пробний збір.
# Щоб зупинити щоденний збір: вкладка Actions → «Збір цін» → «…» → Disable workflow.
name: Збір цін

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect: збір і збереження; probe: розвідка сайту; deep: розвідка адрес; dry-run: пробний збір без запису'
        type: choice
        options: [collect, probe, deep, dry-run]
        default: collect
      target:
        description: 'collect і dry-run: all або магазини через кому (ktc,foxtrot,moyo,citrus); probe: сайти через кому; deep: адреси через кому'
        default: 'all'
      max:
        description: 'dry-run: скільки товарів максимум; або pages=N — по N сторінок у кожному розділі'
        default: '100'
      select:
        description: 'deep: CSS-селектори через ;; (показати перші збіги)'
        default: ''
      json_path:
        description: 'deep: шлях у вбудованому JSON (напр. props.pageProps.data), показати його поля'
        default: ''
      links:
        description: 'deep: регулярний вираз; показати всі посилання сторінки, що йому відповідають (розділи каталогу)'
        default: ''

permissions:
  contents: read

# Один збір за раз: два паралельні запуски подвоїли б навантаження на сайт
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Чесний контакт у User-Agent: власник сайту бачить, чий це робот
  SCRAPER_CONTACT: https://github.com/${{ github.repository }}

jobs:
  # Які магазини збирати сьогодні (і чи збирати взагалі)
  plan:
    if: github.event_name == 'schedule' || inputs.mode == 'collect'
    runs-on: ubuntu-latest
    outputs:
      shops: ${{ steps.plan.outputs.shops }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          TARGET: ${{ github.event_name == 'schedule' && 'all' || inputs.target }}
        run: |
          DATE=$(date -u +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # Дивимось у свіжу гілку, а не лише в знімок на момент створення запуску
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = "schedule" ] && git cat-file -e "FETCH_HEAD:datastore/prices/$DATE/.complete" 2>/dev/null; then
            echo "Ціни за $DATE вже зібрано, повторно не збираємо"
            echo 'shops=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = "all" ]; then
            # Беремо зі списку scrapers у src/scrapers/index.ts, щоб новий магазин збирався без правок тут
            SHOPS=$(sed -n 's/^export const scrapers: ShopScraper\[\] = \[\(.*\)\]$/\1/p' apps/api/src/scrapers/index.ts | tr -d ' ' | tr ',' '\n')
          else
            SHOPS=$(echo "$TARGET" | tr -d ' ' | tr ',' '\n')
          fi
          echo "shops=$(echo "$SHOPS" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "Магазини: $SHOPS"

  # Кожен магазин окремим завданням, паралельно: різні сайти, кожен навантажується як і раніше
  collect:
    needs: plan
    if: needs.plan.outputs.shops != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shop: ${{ fromJSON(needs.plan.outputs.shops) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Збір цін
        run: npm run scrape -- "${{ matrix.shop }}" --fresh --store="$GITHUB_WORKSPACE/datastore"
      - name: Зібране
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prices-${{ matrix.shop }}
          path: |
            datastore/prices/${{ needs.plan.outputs.date }}/${{ matrix.shop }}.jsonl
            datastore/runs/${{ needs.plan.outputs.date }}/${{ matrix.shop }}.json
          if-no-files-found: ignore
          retention-days: 3

  # Зберегти зібране всіма магазинами одним комітом, потім статистика
  save:
    needs: [plan, collect]
    if: always() && needs.plan.outputs.shops != '[]' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: prices-*
          path: datastore
          merge-multiple: true
      - name: Позначка повного збору дня
        if: github.event_name == 'schedule' || inputs.target == 'all'
        run: |
          # Повний збір дня зроблено (навіть якщо котрийсь магазин не відповів): пізніші запуски
          # за розкладом не навантажують магазини вдруге
          mkdir -p "datastore/prices/${{ needs.plan.outputs.date }}"
          date -u +%FT%TZ > "datastore/prices/${{ needs.plan.outputs.date }}/.complete"

      # Спершу зберегти зібране: якщо далі щось зламається, дані дня не пропадуть
      - name: Зберегти дані в репозиторій
        run: scripts/save-datastore.sh "Дані цін за ${{ needs.plan.outputs.date }}"

      - run: npm ci
      - name: Статистика
        id: stats
        continue-on-error: true
        timeout-minutes: 30
        env:
          DATABASE_URL: file:${{ runner.temp }}/stats.db
        run: |
          npm run db:init -w @znyzhky/api
          npm run data:import -- "$GITHUB_WORKSPACE/datastore"
          npm run data:report -- --out="$GITHUB_WORKSPACE/datastore/STATS.md" > /dev/null
          cat datastore/STATS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Зберегти статистику
        if: steps.stats.outcome == 'success'
        run: scripts/save-datastore.sh "Статистика цін за ${{ needs.plan.outputs.date }}"

      - name: Статистика не порахувалась
        if: steps.stats.outcome != 'success'
        run: |
          echo "Дані збережено, але статистика не порахувалась; подробиці в кроці «Статистика»"
          exit 1

      - name: Котрийсь магазин не зібрався
        if: needs.collect.result != 'success'
        run: |
          echo "Не всі магазини зібрались; подробиці в завданнях «collect»"
          exit 1

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Розвідка сайту
        if: inputs.mode == 'probe'
        env:
          TARGET: ${{ inputs.target }}
        run: npm run probe -- "--sites=$TARGET"

      - name: Глибока розвідка адрес
        if: inputs.mode == 'deep'
        env:
          TARGET: ${{ inputs.target }}
          SELECT: ${{ inputs.select }}
          JSON_PATH: ${{ inputs.json_path }}
          LINKS: ${{ inputs.links }}
        run: npm run probe -- "--deep=$TARGET" "--select=$SELECT" "--json-path=$JSON_PATH" "--links=$LINKS"

      - name: Пробний збір (без запису)
        if: inputs.mode == 'dry-run'
        env:
          SHOP: ${{ inputs.target }}
          MAX: ${{ inputs.max }}
        run: |
          case "$MAX" in pages=*) LIMIT="--pages=${MAX#pages=}" ;; *) LIMIT="--max=$MAX" ;; esac
          npm run scrape -- "$SHOP" --dry-run --fresh "$LIMIT"
