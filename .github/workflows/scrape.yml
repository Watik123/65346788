# Збір цін на серверах GitHub (у контейнері розробки доступу до сайтів магазинів немає).
#  - щодня о 05:17 UTC (08:17 за Києвом) збирає ціни й зберігає їх у datastore/;
#  - вручну (вкладка Actions → «Збір цін» → Run workflow): збір, розвідка сайту або пробний збір.
# Щоб зупинити щоденний збір: вкладка Actions → «Збір цін» → «…» → Disable workflow.
name: Збір цін

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect: збір і збереження; probe: розвідка сайту; deep: розвідка адрес; dry-run: пробний збір без запису'
        type: choice
        options: [collect, probe, deep, dry-run]
        default: collect
      target:
        description: 'collect і dry-run: slug магазину (ktc); probe: адреса сайту; deep: адреси через кому'
        default: 'ktc'
      max:
        description: 'Скільки товарів максимум (dry-run)'
        default: '100'

permissions:
  contents: read

# Один збір за раз: два паралельні запуски подвоїли б навантаження на сайт
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Чесний контакт у User-Agent: власник сайту бачить, чий це робот
  SCRAPER_CONTACT: https://github.com/${{ github.repository }}

jobs:
  collect:
    if: github.event_name == 'schedule' || inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Збір цін
        id: scrape
        env:
          SHOP: ${{ inputs.target || 'ktc' }}
        run: |
          set +e
          npm run scrape -- "$SHOP" --fresh --store="$GITHUB_WORKSPACE/datastore"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Статистика
        env:
          DATABASE_URL: file:${{ runner.temp }}/stats.db
        run: |
          npm run db:init -w @znyzhky/api
          npm run data:import -- "$GITHUB_WORKSPACE/datastore"
          npm run data:report -- --out="$GITHUB_WORKSPACE/datastore/STATS.md" > /dev/null
          cat datastore/STATS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Зберегти дані в репозиторій
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datastore
          if git diff --cached --quiet; then echo "Нових даних немає"; exit 0; fi
          git commit -m "Дані цін за $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1

      - name: Збір завершився з помилкою
        if: steps.scrape.outputs.code != '0'
        run: |
          echo "Збір завершився з кодом ${{ steps.scrape.outputs.code }}; подробиці в кроці «Збір цін» і в datastore/runs/"
          exit 1

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Розвідка сайту
        if: inputs.mode == 'probe'
        env:
          TARGET: ${{ inputs.target }}
        run: npm run probe -- "$TARGET" --pages=6

      - name: Глибока розвідка адрес
        if: inputs.mode == 'deep'
        env:
          TARGET: ${{ inputs.target }}
        run: npm run probe -- "--deep=$TARGET"

      - name: Пробний збір (без запису)
        if: inputs.mode == 'dry-run'
        env:
          SHOP: ${{ inputs.target }}
          MAX: ${{ inputs.max }}
        run: npm run scrape -- "$SHOP" --dry-run --fresh --max="$MAX"
